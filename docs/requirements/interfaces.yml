- id: IF-010
  text: >-
    The service shall read orbital elements from CelesTrak as CCSDS Orbit Mean-Elements Messages (OMM) in JSON,
    for a single satellite and for a whole group.
  verification: T

- id: IF-020
  text: >-
    The service shall read satellite transmitters from the SatNOGS DB transmitter API in JSON.
  verification: T

- id: IF-030
  text: >-
    Served element sets shall keep the full epoch precision of the source, in UTC, with mean motion in
    revolutions per day and angles in degrees.
  verification: T

- id: IF-040
  text: >-
    The service shall decode telemetry as laid out in the TM link ICD (docs/icd/tm-link.md): CCSDS space packets
    (CCSDS 133.0-B-2) with PUS-C telemetry secondary headers (ECSS-E-ST-70-41C) and a CRC-16-CCITT packet error
    control field, carried in TM transfer frames over TCP.
  verification: T

- id: IF-050
  text: >-
    Packet generation times shall be read as CUC time with 4 bytes of coarse and 2 bytes of fine time, counted in
    TAI seconds since 1958-01-01, and served in UTC.
  verification: T

- id: IF-060
  text: >-
    The service shall read TM transfer frames (CCSDS 132.0-B) as laid out in the TM link ICD: 64 bytes, a primary
    header with spacecraft ID, virtual channel, master and virtual channel frame counts and first header pointer, no
    operational control field or secondary header, and a CRC-16-CCITT frame error control field.
  verification: T

- id: IF-070
  text: >-
    The service shall find frames by the attached sync marker 1ACFFC1D and derandomize them with the CCSDS 131.0-B
    pseudo-randomizer; when the marker doesn't follow a frame, it shall search the stream for the next marker.
  verification: T

- id: IF-080
  text: >-
    The service shall read observations from the SatNOGS Network API in JSON, without an account, following the
    cursor of the Link header to older pages, and read each demodulated frame file as raw bytes or as hexadecimal
    text, with the reception time taken from the file name.
  verification: T
