spring:
  main:
    banner-mode: off
  docker:
    compose:
      lifecycle-management: start-only

springdoc:
  default-produces-media-type: application/json

groundstation:
  orekit-data-path: orekit-data

  pass-detection:
    max-check-s: 30.0
    threshold-s: 0.001

  celestrak:
    base-url: https://celestrak.org
    refresh: 2h
    connect-timeout: 5s
    read-timeout: 10s
