spring:
  main:
    banner-mode: off
  task:
    scheduling:
      pool:
        size: 4
  docker:
    compose:
      lifecycle-management: start-only

springdoc:
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, modulith

groundstation:
  orekit-data-path: orekit-data

  pass-detection:
    max-check-s: 30.0
    threshold-s: 0.001

  catalog:
    refresh:
      interval: 4h
      groups: amateur, weather, stations

  celestrak:
    base-url: https://celestrak.org
    connect-timeout: 5s
    read-timeout: 10s

  radio:
    sync:
      interval: 24h

  satnogs:
    base-url: https://db.satnogs.org
    connect-timeout: 5s
    read-timeout: 30s
    network:
      base-url: https://network.satnogs.org
      connect-timeout: 5s
      read-timeout: 30s
    import:
      satellites: 69015
      interval: 1h
      look-back: 2d
      settle: 1h

  tmtc:
    link:
      norad-id: 99999
      station: Vilnius
      spacecraft-id: 42
      frame-length: 64
      host: localhost
      port: 10015
      connect-timeout: 2s
      reconnect-delay: 5s
      mission-database: classpath:mdb/simulator.xml
    mission-databases:
      - norad-id: 69015
        location: classpath:mdb/frontiersat.xml
        frame-check: CRC32C_TRAILER

  contact:
    silence-threshold: 10s
    plan-interval: 10m
    max-frame-loss: 0.05
