spring:
  main:
    banner-mode: off
  docker:
    compose:
      lifecycle-management: start-only

groundstation:
  orekit-data-path: orekit-data

  station:
    name: Vilnius
    latitude-deg: 54.67519
    longitude-deg: 25.23422
    altitude-m: 114

  time-zone: Europe/Vilnius

  forecast:
    satellite: 25544
    duration: 1d

  pass-detection:
    min-elevation-deg: 5.0
    max-check-s: 30.0
    threshold-s: 0.001

  celestrak:
    base-url: https://celestrak.org
    refresh: 2h
