buildscript {
    dependencies {
        constraints {
            classpath('org.apache.commons:commons-lang3:3.18.0') {
                because 'CVE-2025-48924: commons-compress in the Spring Boot Gradle plugin brings in 3.16.0'
            }
            classpath('tools.jackson.core:jackson-databind:3.1.8') {
                because 'CVE-2026-110879: the Spring Boot Gradle plugin brings in 3.1.7'
            }
        }
    }
}

plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lt.vsh1ft'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext['jackson-bom.version'] = '3.1.8'
ext['jackson-2-bom.version'] = '2.21.8'

dependencyManagement {
    imports {
        mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.2'
    }
}

dependencies {
    implementation project(':ccsds')
    implementation project(':xtce')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'org.orekit:orekit:13.1.9'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = '0.8.16'
}

springBoot {
    buildInfo()
}

bootRun {
    workingDir = rootProject.projectDir
}

test {
    useJUnitPlatform {
        excludeTags 'live'
    }
    workingDir = rootProject.projectDir
    def requirements = rootProject.file('docs/requirements')
    def traceability = layout.buildDirectory.dir('reports/requirements')
    inputs.dir(requirements)
    outputs.dir(traceability)
    systemProperty 'groundstation.requirements.directory', requirements.absolutePath
    systemProperty 'groundstation.requirements.report', traceability.get().asFile.absolutePath
    finalizedBy jacocoTestReport
}

tasks.register('verifyRequirements') {
    description = 'Fails when a requirement verified by test has no passing test.'
    group = 'verification'
    dependsOn test
    def violations = layout.buildDirectory.file('reports/requirements/violations.txt')
    inputs.file(violations)
    doLast {
        def found = violations.get().asFile.readLines().findAll { !it.isBlank() }
        if (found) {
            throw new GradleException('Requirements not verified:\n  ' + found.join('\n  '))
        }
    }
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['lt.vsh1ft.groundstation.GroundStationApplication']
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification, verifyRequirements
}

tasks.register('liveTest', Test) {
    description = 'Runs the tests that call live external services such as CelesTrak.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    workingDir = rootProject.projectDir
}