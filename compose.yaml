services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: groundstation
      POSTGRES_USER: groundstation
      POSTGRES_PASSWORD: groundstation
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundstation -d groundstation"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
